name: Patch home hero CSS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-home-hero-css.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact CSS changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/index.module.css')
          s = p.read_text()

          s = s.replace(
              '  align-items: center;\n  display: grid;\n  gap: var(--linsi-space-48);\n  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.9fr);\n  width: 100%;\n}',
              '  align-items: start;\n  display: grid;\n  gap: var(--linsi-space-48);\n  grid-template-columns: minmax(0, 1fr) minmax(240px, 0.9fr);\n  width: 100%;\n}',
              1,
          )

          start = s.index('.mediaColumn {')
          end = s.index('.logo {', start)
          s = s[:start] + '''.mediaColumn {\n  aspect-ratio: 1 / 1;\n  border-radius: var(--linsi-radius-lg);\n  justify-self: start;\n  min-height: 0;\n  overflow: hidden;\n  width: 100%;\n}\n\n.heroCover {\n  display: block;\n  height: auto;\n  width: 100%;\n}\n\n''' + s[end:]

          s = s.replace(
              '  margin-bottom: var(--linsi-space-48);\n  width: 163px;',
              '  margin-bottom: var(--linsi-space-16);\n  width: 163px;',
              1,
          )

          s = s.replace(
              '''  .mediaColumn {\n    aspect-ratio: 16 / 10;\n    margin-bottom: var(--linsi-space-48);\n    max-width: 520px;\n    min-height: 200px;\n    order: 3;\n  }\n\n  .heroFlow {\n    height: auto;\n  }''',
              '''  .mediaColumn {\n    aspect-ratio: 1 / 1;\n    margin-bottom: var(--linsi-space-48);\n    max-width: 520px;\n    min-height: 0;\n    order: 3;\n  }''',
          )

          s = s.replace(
              '''  .logo {\n    margin-bottom: var(--linsi-space-32);\n    width: 136px;\n  }\n\n  .mediaColumn {\n    aspect-ratio: 4 / 3;\n  }''',
              '''  .logo {\n    margin-bottom: var(--linsi-space-16);\n    width: 136px;\n  }\n\n  .mediaColumn {\n    aspect-ratio: 1 / 1;\n  }''',
          )

          assert 'heroFlow' not in s
          assert '.heroCover {' in s
          assert '.layout {\n  align-items: start;' in s
          assert 'margin-bottom: var(--linsi-space-16);\n  width: 163px;' in s
          p.write_text(s)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/patch-home-hero-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align provided home hero image"
          git push
