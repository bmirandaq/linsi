name: Cleanup merged branches

on:
  push:
    branches:
      - chore/repo-hygiene

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hygiene branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged branches
        shell: bash
        run: |
          branches=(
            'agent/configurar-preview-netlify'
            'agent/corrigir-submenu-estrutura-linsi'
            'chore/remove-drawio-template-card'
            'chore/spacing-scale'
            'chore/typescript-incremental'
            'docs/glossario-v3'
            'feat/cafe-bea-layout'
            'feat/contato-form'
            'feat/home-template-history'
            'feat/palette-v2'
            'feat/search-refinement'
            'fix/color-token-test-custom-css-order'
            'fix/footer-logo-gap'
            'fix/home-logo-theme-flash'
            'fix/remove-orphan-screenflows-sidebar'
            'fix/sidebar-collapse-footer-gap'
            'fix/sidebar-linsi-screenflows'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-clean-merged-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary branch cleanup workflow"
          git push origin HEAD:"$GITHUB_REF_NAME"

# Temporary workflow; self-removes after successful cleanup.
