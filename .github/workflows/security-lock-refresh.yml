name: Refresh security dependency lock

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/security-dependencies-2026-10'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "chore: refresh dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Capture production audit
        run: npm audit --omit=dev --json > security-audit.json || true

      - name: Upload refreshed lock and audit
        uses: actions/upload-artifact@v4
        with:
          name: security-lock-refresh
          path: |
            package-lock.json
            security-audit.json
          if-no-files-found: error
