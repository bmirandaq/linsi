name: Renormalize package lock

on:
  push:
    branches:
      - chore/repo-hygiene

permissions:
  contents: write

jobs:
  renormalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Renormalize package-lock to LF
        shell: bash
        run: |
          git add --renormalize package-lock.json
          rm .github/workflows/temp-renormalize-lock.yml
          git add -A

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize package-lock to LF"
          git push origin HEAD:"$GITHUB_REF_NAME"
