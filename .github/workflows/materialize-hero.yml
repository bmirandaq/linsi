name: Materialize hero image

on:
  push:
    branches:
      - main
    paths:
      - '.github/hero-asset/**'
      - '.github/workflows/materialize-hero.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode provided PNG
        shell: bash
        run: |
          mkdir -p static/img
          cat .github/hero-asset/part0 .github/hero-asset/part1 .github/hero-asset/part2 .github/hero-asset/part3 .github/hero-asset/part4 | base64 --decode > static/img/cover-hero.png
          test "$(git hash-object static/img/cover-hero.png)" = "5de356f5040e1d7809e9df3dff4cf69337e97cc4"

      - name: Commit binary asset and clean temporary files
        shell: bash
        run: |
          rm -rf .github/hero-asset
          rm .github/workflows/materialize-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/cover-hero.png .github/hero-asset .github/workflows/materialize-hero.yml
          git commit -m "fix: add provided hero image asset"
          git push
