name: Empacotar Assistente LINSI

on:
  push:
    branches: [assistant-phase-1, main]
    paths:
      - 'assistant/skill/**'
      - '.github/workflows/package-assistant-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Verificar nucleo portatil da Skill
        run: |
          test -f assistant/skill/SKILL.md
          test -d assistant/skill/references

      - name: Validar metadados portateis
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('assistant/skill/SKILL.md').read_text(encoding='utf-8')
          frontmatter = re.match(r'^---\n(.*?)\n---', text, re.S)
          if not frontmatter:
              raise SystemExit('SKILL.md sem frontmatter YAML valido')

          fields = {}
          for line in frontmatter.group(1).splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  fields[key.strip()] = value.strip()

          if fields.get('name') != 'linsi-assistant':
              raise SystemExit('name deve ser linsi-assistant')

          description = fields.get('description', '')
          if not description:
              raise SystemExit('description obrigatoria')
          if len(description) > 200:
              raise SystemExit(f'description excede 200 caracteres: {len(description)}')
          PY

      - name: Verificar metadata OpenAI
        run: test -f assistant/skill/agents/openai.yaml

      - name: Empacotar Skill
        run: |
          mkdir -p dist/package/linsi-assistant
          cp -R assistant/skill/. dist/package/linsi-assistant/
          cd dist/package
          zip -r ../skill.zip linsi-assistant

      - name: Verificar estrutura do pacote
        run: |
          unzip -l dist/skill.zip | grep -q 'linsi-assistant/SKILL.md'
          unzip -l dist/skill.zip | grep -q 'linsi-assistant/references/'

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: assistente-linsi-0.1-beta
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 30
