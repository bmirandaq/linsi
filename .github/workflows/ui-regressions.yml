name: Validar regressões de UI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm run audit:dependencies

      - name: Preparar download da Skill
        run: |
          mkdir -p static/downloads/assistente-linsi
          cd assistant
          zip -r ../static/downloads/assistente-linsi/skill.zip skill

      - name: Rodar contratos, build e auditorias
        run: npm run build
        env:
          SITE_URL: http://127.0.0.1:3000
          BASE_URL: /

      - name: Instalar Chromium para regressão responsiva
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Servir build localmente
        run: |
          npm run serve -- --host 127.0.0.1 --port 3000 > /tmp/linsi-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/linsi-serve.log
          exit 1

      - name: Rodar smoke regressivo responsivo
        run: node scripts/test-responsive-smoke.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar canvas do dark mode
        run: node scripts/test-dark-canvas.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar formulário com integrações simuladas
        run: node scripts/test-contact-form.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar checkout do Workshop no navegador
        run: node scripts/test-workshop-checkout.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Capturar QA visual do Workshop
        run: node scripts/capture-workshop-qa.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Publicar screenshots do Workshop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-visual-qa
          path: artifacts/workshop-qa/*.png
          if-no-files-found: error

      - name: Validar docs mobile no iPhone 16 Pro Max em todas as fontes
        run: |
          for font in manrope inter opendyslexic georgia; do
            echo "=== $font ==="
            FONT_PREFERENCE="$font" node scripts/test-mobile-docs-layout.mjs
          done
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

  preview-integration:
    name: QA real Checkout Pro em Worker preview
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/workshop-checkout-pro'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch da PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Verificar credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Adaptar somente o preview ao Turnstile E2E oficial
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'worker/index.js';
          const source = fs.readFileSync(file, 'utf8');
          const before = "const requiredAction = env.TURNSTILE_EXPECTED_ACTION || expectedAction;\n    return result.success === true && result.hostname === expectedHostname && result.action === requiredAction;";
          const after = "const requiredAction = env.TURNSTILE_EXPECTED_ACTION || expectedAction;\n    const actionMatches = env.TURNSTILE_EXPECTED_ACTION === '__official_e2e_no_action__'\n      ? true\n      : result.action === requiredAction;\n    return result.success === true && result.hostname === expectedHostname && actionMatches;";
          if (!source.includes(before)) throw new Error('Turnstile preview adapter target not found');
          fs.writeFileSync(file, source.replace(before, after));
          NODE

      - name: Criar versão preview do Worker sem deploy
        id: worker-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          cat > /tmp/turnstile-preview.env <<'EOF'
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          EOF
          npx wrangler@4 versions upload \
            --config worker/wrangler.toml \
            --keep-vars \
            --secrets-file /tmp/turnstile-preview.env \
            --var ALLOWED_ORIGIN:https://linsi.beamiranda.com.br \
            --var TURNSTILE_EXPECTED_HOSTNAME:example.com \
            --var TURNSTILE_EXPECTED_ACTION:__official_e2e_no_action__ \
            2>&1 | tee /tmp/wrangler-preview.log
          rm -f /tmp/turnstile-preview.env
          PREVIEW_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-preview.log | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Wrangler não retornou uma Preview URL."
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Testar integração real sem mock de aplicação
        env:
          WORKER_PREVIEW_URL: ${{ steps.worker-preview.outputs.url }}
        run: node scripts/test-workshop-preview-real.mjs

      - name: Publicar evidência do Checkout Pro real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-checkout-pro-real-preview
          path: artifacts/workshop-preview-real/*.png
          if-no-files-found: warn
