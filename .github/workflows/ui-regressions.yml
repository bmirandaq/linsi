name: Validar regressões de UI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm run audit:dependencies

      - name: Verificar tipos
        run: npm run typecheck

      - name: Preparar download da Skill
        run: |
          mkdir -p static/downloads/assistente-linsi
          cd assistant
          zip -r ../static/downloads/assistente-linsi/skill.zip skill

      - name: Rodar contratos, build e auditorias
        run: npm run build
        env:
          SITE_URL: http://127.0.0.1:3000
          BASE_URL: /

      - name: Instalar Chromium para regressão responsiva
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Servir build localmente
        run: |
          npm run serve -- --host 127.0.0.1 --port 3000 > /tmp/linsi-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/linsi-serve.log
          exit 1

      - name: Rodar smoke regressivo responsivo
        run: node scripts/test-responsive-smoke.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar analytics desabilitado
        run: |
          node scripts/test-analytics-build.cjs build
          node scripts/test-analytics-browser.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar canvas do dark mode
        run: node scripts/test-dark-canvas.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar formulário com integrações simuladas
        run: node scripts/test-contact-form.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Validar redirect legado do Workshop
        run: node scripts/test-workshop-redirect.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Capturar QA visual do Workshop atual
        run: node scripts/capture-workshop-qa.mjs
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Publicar screenshots do Workshop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-visual-qa
          path: artifacts/workshop-qa/*.png
          if-no-files-found: error

      - name: Validar docs mobile no iPhone 16 Pro Max em todas as fontes
        run: |
          for font in manrope inter opendyslexic georgia; do
            echo "=== $font ==="
            FONT_PREFERENCE="$font" node scripts/test-mobile-docs-layout.mjs
          done
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000

      - name: Gerar build com IDs fictícios de analytics
        run: npx docusaurus build --out-dir build-analytics
        env:
          SITE_URL: http://127.0.0.1:3001
          BASE_URL: /
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: '00000000000000000000000000000000'
          CLARITY_PROJECT_ID: analyticsqa

      - name: Servir build com analytics e validar integração
        run: |
          node scripts/test-analytics-build.cjs build-analytics
          npm run serve -- --dir build-analytics --host 127.0.0.1 --port 3001 > /tmp/linsi-analytics-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then
              node scripts/test-analytics-browser.mjs
              exit $?
            fi
            sleep 1
          done
          cat /tmp/linsi-analytics-serve.log
          exit 1
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3001
          ANALYTICS_TEST_ENABLED: '1'

      - name: Comparar Home com e sem analytics
        run: node scripts/test-analytics-visual.mjs
        env:
          ANALYTICS_BASELINE_URL: http://127.0.0.1:3000
          SMOKE_BASE_URL: http://127.0.0.1:3001

      - name: Publicar comparação visual de analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-visual-qa
          path: artifacts/analytics-qa/*.png
          if-no-files-found: error

