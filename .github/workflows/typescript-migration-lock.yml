name: Atualizar lockfile TypeScript

on:
  push:
    branches: [chore/typescript-incremental]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/typescript-incremental
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Atualizar package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commitar lockfile quando necessario
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update lockfile for TypeScript"
          git push
