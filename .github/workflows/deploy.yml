name: Publicar documentação no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Auditar dependências
        run: npm run audit:dependencies

      - name: Preparar download da Skill
        run: |
          mkdir -p static/downloads/assistente-linsi
          cd assistant
          zip -r ../static/downloads/assistente-linsi/skill.zip skill

      - name: Gerar site
        run: npm run build
        env:
          SITE_URL: https://linsi.beamiranda.com.br
          BASE_URL: /

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
