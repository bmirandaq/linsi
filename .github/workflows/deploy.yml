name: Publicar LINSI em produção

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Auditar dependências
        run: npm run audit:dependencies

      - name: Preparar download da Skill
        run: |
          mkdir -p static/downloads/assistente-linsi
          cd assistant
          zip -r ../static/downloads/assistente-linsi/skill.zip skill

      - name: Gerar site
        run: npm run build
        env:
          SITE_URL: https://linsi.beamiranda.com.br
          BASE_URL: /

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    name: Publicar formulário no Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Verificar credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN não configurado no repositório."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID não configurado no repositório."
            exit 1
          fi

      - name: Publicar Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy
